<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rez3D - Login</title>
    <link rel="stylesheet" href="/css/stileAma.css">
</head>
<body>

    <!-- NAVBAR -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- MAIN CENTRATO -->
    <main class="main-centered">
        
        <!-- QUESTO FORM PRENDE AUTOMATICAMENTE STILE, SFONDO E LARGHEZZA MASSIMA DAL CSS -->
        <form class="auth-card" th:action="@{/login}" method="POST">
            <h1>Accedi</h1>
            
            <div>
                <label>Username</label>
                <input name="username" type="text" required placeholder="Inserisci il tuo username..." />
            </div>
            
            <div>
                <label>Password</label>
                <input name="password" type="password" required placeholder="La tua password segreta..." />
            </div>
            
            <div>
                <span class="error-message" th:if="${param.error != null}">Username o password errati! Riprova.</span>
            </div>
            
            <div>
                <button type="submit">Entra nel negozio</button>
            </div>
        </form>

        <!-- LINK REGISTRAZIONE SOTTO IL FORM -->
        <div>
            <span style="color: var(--text-muted);">Non hai un account? </span>
            <a th:href="@{/register}" style="font-weight: bold;">Registrati</a>
        </div>
        
    </main>

</body>
</html>
