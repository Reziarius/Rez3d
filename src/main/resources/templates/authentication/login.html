<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rez3D - Login</title>
    <link rel="stylesheet" href="/css/stileAma.css">
</head>
<body>

    <!-- NAVBAR -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- MAIN CENTRATO -->
    <main class="main-centered" style="margin-top: 30px;">
        
        <!-- Pulsante Torna Indietro -->
        <div style="margin-bottom: 15px; text-align: left; width: 100%; max-width: 400px;">
            <a th:href="@{/}" style="text-decoration: none; color: #007185; font-weight: bold; font-size: 15px; display: inline-flex; align-items: center; gap: 5px;">
                &larr; Torna alla Home
            </a>
        </div>

        <div th:if="${param.registered != null}" style="background-color: #d4edda; color: #155724; padding: 12px 20px; border-radius: 8px; margin-bottom: 20px; text-align: center; max-width: 400px; font-weight: bold;">
            Registrazione completata con successo! Ora puoi accedere.
        </div>

        <form class="auth-card" th:action="@{/login}" method="POST">
            <h1>Accedi</h1>
            
            <div>
                <label>Username</label>
                <input name="username" type="text" required placeholder="Inserisci il tuo username..." />
            </div>
            
            <div>
                <label>Password</label>
                <input name="password" type="password" required placeholder="La tua password segreta..." />
            </div>
            
            <div>
                <span class="error-message" th:if="${param.error != null}">Username o password errati! Riprova.</span>
            </div>
            
            <div>
                <button type="submit">Entra nel negozio</button>
            </div>
        </form>

        <!-- LINK REGISTRAZIONE SOTTO IL FORM -->
        <div>
            <span style="color: var(--text-muted);">Non hai un account? </span>
            <a th:href="@{/register}" style="font-weight: bold;">Registrati</a>
        </div>
        
    </main>

</body>
</html>
