<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rez3D - Login</title>
    <link rel="stylesheet" href="/css/stileScuro.css">
</head>
<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <div class="navbar-container">
            <a href="/">
                <div class="nav-brand">Rez<span>3D</span></div>
            </a>
            
            <div class="nav-actions">
                <div th:if="${userDetails}" style="display: flex; gap: 15px; align-items: center;"> 
                    <span th:text="${userDetails.username}" style="color: white; font-weight: bold;"></span>
                    <!-- Questo form prende l'eccezione .form-logout nel CSS -->
                    <form th:action="@{/logout}" method="POST" class="form-logout">
                        <button type="submit" class="btn-logout">Logout</button>
                    </form>
                </div>
                
                <div th:unless="${userDetails}">
                    <a href="/login">Login</a>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN CENTRATO -->
    <main class="main-centered">
        
        <!-- QUESTO FORM PRENDE AUTOMATICAMENTE STILE, SFONDO E LARGHEZZA MASSIMA DAL CSS -->
        <form th:action="@{/login}" method="POST">
            <h1>Accedi</h1>
            
            <div>
                <label>Username</label>
                <input name="username" type="text" required placeholder="Inserisci il tuo username..." />
            </div>
            
            <div>
                <label>Password</label>
                <input name="password" type="password" required placeholder="La tua password segreta..." />
            </div>
            
            <div>
                <span class="error-message" th:if="${param.error != null}">Username o password errati! Riprova.</span>
            </div>
            
            <div>
                <button type="submit">Entra nel negozio</button>
            </div>
        </form>

        <!-- LINK REGISTRAZIONE SOTTO IL FORM -->
        <div>
            <span style="color: var(--text-muted);">Non hai un account? </span>
            <a th:href="@{/register}" style="font-weight: bold;">Registrati</a>
        </div>
        
    </main>

</body>
</html>
