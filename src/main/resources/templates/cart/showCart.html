<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il tuo Carrello - Rez3D</title>
    <!-- Usa il tuo file CSS principale -->
    <link rel="stylesheet" href="/css/stileAma.css" />
</head>

<body>
    <!-- Navbar unificata -->
    <header th:replace="~{fragments/navbar :: navbar}"></header>

    <main class="cart-container">
        <!-- Pulsante Torna Indietro -->
        <div style="margin-bottom: 20px;">
            <a th:href="@{/files}" style="text-decoration: none; color: #007185; font-weight: bold; font-size: 15px; display: inline-flex; align-items: center; gap: 5px;">
                &larr; Torna al Catalogo
            </a>
        </div>

        <h1 style="border-bottom: none; margin-bottom: 30px;">Il tuo Carrello (<span th:text="${carrello.items != null ? carrello.items.size() : 0}"></span>)
        </h1>

        <!-- Messaggio carrello vuoto -->
        <div th:if="${carrello.items == null || carrello.items.isEmpty()}" class="empty-cart">
            <div style="font-size: 3rem; margin-bottom: 10px;">🛒</div>
            <h2>Il tuo carrello è vuoto</h2>
            <p style="color: var(--text-muted); margin-bottom: 20px;">Inizia a personalizzare i nostri modelli!</p>
            <a th:href="@{/files}" class="btn-action">Vai al Catalogo</a>
        </div>

        <!-- Lista prodotti (Stile Amazon) -->
        <div th:if="${carrello.getItems() != null && !carrello.getItems().isEmpty()}">

            <div class="cart-list">

                <!-- Singolo elemento del carrello -->
                <div th:each="line : ${lines}" class="cart-item">

                    <!-- 1. DETTAGLI A SINISTRA -->
                    <div class="cart-item-details">
                        <h3 th:text="${line.getProduct().getFile().name}">Nome Modello</h3>

                        <p class="item-specs">
                            <span>Dimensione: <strong th:text="${line.getProduct().getSize()}">Media</strong></span>
                            <span class="separator">•</span>
                            <span>Finitura:
                                <strong th:if="${line.getProduct().getDipinto()}">Dipinto a mano</strong>
                                <strong th:unless="${line.getProduct().getDipinto()}">Stampa grezza</strong>
                            </span>
                        </p>
                    </div>

                    <!-- 2. QUANTITÀ AL CENTRO -->
                    <div class="cart-item-qty">
                        <form th:action="@{/cart/update/{id}(id=${line.id})}" method="POST" class="form-inline">
                            <input type="number" name="quantity" th:value="${line.quantity}" min="1" class="qty-input">
                            <button type="submit" class="btn-update">Aggiorna</button>
                        </form>
                    </div>

                    <!-- 3. PREZZI ED ELIMINAZIONE A DESTRA -->
                    <div class="cart-item-actions">
                        <div class="price-block">
                            <!-- Prezzo unitario in piccolo -->
                            <span class="unit-price">€ <span th:text="${line.getProduct().getFinalPrice()}">0.00</span>
                                / pz</span>
                            <!-- Prezzo totale riga in grande -->
                            <span class="row-total">€ <span
                                    th:text="${line.quantity * line.getProduct().getFinalPrice()}">0.00</span></span>
                        </div>

                        <!-- Bottone elimina stile link (Discreto, stile Amazon) -->
                        <form th:action="@{/cart/remove/{id}(id=${line.id})}" method="POST" class="form-inline">
                            <button type="submit" class="btn-danger-link">Rimuovi</button>
                        </form>
                    </div>

                </div>
            </div>

            <div style="border-top: 2px solid #333; padding-top: 20px; margin-top: 20px;">
                <h3>Dati di Spedizione e Checkout</h3>

                <form th:action="@{/checkout}" method="POST"
                    style="display: flex; flex-direction: column; gap: 10px; max-width: 400px;">

                    <div>
                        <label>Indirizzo (Via e Civico):</label><br>
                        <input type="text" name="indirizzo" required style="width: 100%;">
                    </div>

                    <div style="display: flex; gap: 10px;">
                        <div style="flex: 2;">
                            <label>Città:</label><br>
                            <input type="text" name="citta" required style="width: 100%;">
                        </div>
                        <div style="flex: 1;">
                            <label>CAP:</label><br>
                            <input type="text" name="cap" required style="width: 100%;">
                        </div>
                    </div>

                    <button type="submit"
                        style="margin-top: 15px; padding: 10px; background-color: #28a745; color: white; border: none; font-size: 18px; cursor: pointer;">
                        Conferma Ordine
                    </button>
                </form>
            </div>

        </div>
    </main>
</body>

</html>
