<!DOCTYPE html>
<html>

<head>
    <title>Gestione File Di Stampa</title>
    <link rel="stylesheet" href="/css/stile.css" />
</head>

<body>
    <h1 th:text="${file.id != null ? 'Modifica file' : 'Nuovo file'}">Gestione file</h1>



    <form th:action="@{/admin/files}" method="POST" th:object="${file}">

        <div th:if="${#fields.hasGlobalErrors()}" class="error">
            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}">Errore</p>
        </div>

        <input type="hidden" th:field="*{id}" />

        <div>
            <label >Nome file:</label>
            <input type="text" th:field="*{name}" required />
            <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Errore</span>
        </div>

        <div>
            <label>Prezzo:</label>
            <input type="number" step="0.01" th:field="*{price}" required />
            <span th:if="${#fields.hasErrors('price')}" th:errors="*{price}">Errore</span>
        </div>

         <div>
            <label>Categoria:</label>
            <input type="text"  th:field="*{category}" required />
            <span th:if="${#fields.hasErrors('category')}" th:errors="*{category}">Errore</span>
        </div>

        <div>
            <label>Artista:</label>
            <input type="text"  th:field="*{artist}" required />
            <span th:if="${#fields.hasErrors('artist')}" th:errors="*{artist}">Errore</span>
        </div>

        <div>
            <button type="submit">Salva file</button>
        </div>
    </form>

     <div>
        <br>
        <a href="/files">Annulla e Torna all'elenco dei File</a>
    </div>
</body>

</html>
