<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Gestione File Di Stampa</title>
    <link rel="stylesheet" href="/css/stileAma.css" />
</head>

<body style="background-color: #eaeded; margin: 0; font-family: Arial, sans-serif;">
    
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Container ridotto a 600px per rendere il form compatto e centrato -->
    <main style="max-width: 600px; margin: 40px auto; padding: 0 20px;">
        
        <h1 th:text="${file.id != null ? 'Modifica file' : 'Nuovo file'}" style="color: #0F1111; margin-bottom: 25px; font-size: 28px; text-align: center;">
            Gestione file
        </h1>

        <!-- Box bianco stile Card -->
        <div style="background: white; border: 1px solid #ddd; border-radius: 8px; padding: 30px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
            
            <form th:action="@{/admin/files}" method="POST" th:object="${file}" style="display: flex; flex-direction: column; gap: 20px;">

                <!-- Gestione Errori Globali -->
                <div th:if="${#fields.hasGlobalErrors()}" style="background-color: #f8d7da; color: #721c24; padding: 15px; border-radius: 4px; border: 1px solid #f5c6cb;">
                    <p th:each="err : ${#fields.globalErrors()}" th:text="${err}" style="margin: 0; font-weight: bold;">Errore</p>
                </div>

                <input type="hidden" th:field="*{id}" />

                <!-- Campo Nome File -->
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label style="font-weight: bold; color: #0F1111; font-size: 14px;">Nome file:</label>
                    <input type="text" th:field="*{name}" required style="padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px;" onfocus="this.style.boxShadow='0 0 0 2px #c8f3fa'; this.style.borderColor='#007185'" onblur="this.style.boxShadow='none'; this.style.borderColor='#ccc'" />
                    <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color: #d11a2a; font-size: 12px; font-weight: bold;">Errore</span>
                </div>

                <!-- Campo Prezzo -->
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label style="font-weight: bold; color: #0F1111; font-size: 14px;">Prezzo (€):</label>
                    <input type="number" step="0.01" th:field="*{price}" required style="padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px;" onfocus="this.style.boxShadow='0 0 0 2px #c8f3fa'; this.style.borderColor='#007185'" onblur="this.style.boxShadow='none'; this.style.borderColor='#ccc'" />
                    <span th:if="${#fields.hasErrors('price')}" th:errors="*{price}" style="color: #d11a2a; font-size: 12px; font-weight: bold;">Errore</span>
                </div>

                <!-- Campo Categoria -->
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label style="font-weight: bold; color: #0F1111; font-size: 14px;">Categoria:</label>
                    <input type="text" th:field="*{category}" required style="padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px;" onfocus="this.style.boxShadow='0 0 0 2px #c8f3fa'; this.style.borderColor='#007185'" onblur="this.style.boxShadow='none'; this.style.borderColor='#ccc'" />
                    <span th:if="${#fields.hasErrors('category')}" th:errors="*{category}" style="color: #d11a2a; font-size: 12px; font-weight: bold;">Errore</span>
                </div>

                <!-- Campo Artista -->
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label style="font-weight: bold; color: #0F1111; font-size: 14px;">Artista:</label>
                    <input type="text" th:field="*{artist}" required style="padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px;" onfocus="this.style.boxShadow='0 0 0 2px #c8f3fa'; this.style.borderColor='#007185'" onblur="this.style.boxShadow='none'; this.style.borderColor='#ccc'" />
                    <span th:if="${#fields.hasErrors('artist')}" th:errors="*{artist}" style="color: #d11a2a; font-size: 12px; font-weight: bold;">Errore</span>
                </div>

                <!-- Bottone di Submit -->
                <div style="margin-top: 15px;">
                    <button type="submit" style="width: 100%; background-color: #FFD814; color: #0F1111; padding: 12px; border-radius: 100px; text-decoration: none; font-size: 14px; font-weight: bold; border: 1px solid #FCD200; transition: background-color 0.2s; cursor: pointer;" onmouseover="this.style.backgroundColor='#F7CA00'" onmouseout="this.style.backgroundColor='#FFD814'">
                        Salva file
                    </button>
                </div>
                
            </form>
        </div>

        <!-- Link di ritorno -->
        <div style="text-align: center; margin-top: 25px;">
            <a href="/files" style="color: #007185; text-decoration: none; font-size: 14px; font-weight: bold;" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">
                ← Annulla e Torna all'elenco dei File
            </a>
        </div>

    </main>
</body>

</html>
