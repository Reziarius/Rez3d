<!DOCTYPE html>
<html>

<head>
    <title>Personalizza modello</title>
    <link rel="stylesheet" href="/css/stileAma.css">
</head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main style="max-width: 600px; margin: 30px auto; padding: 0 20px;">
        <div style="margin-bottom: 20px;">
            <a th:href="@{/files}" style="text-decoration: none; color: #007185; font-weight: bold; font-size: 15px; display: inline-flex; align-items: center; gap: 5px;">
                &larr; Torna al Catalogo
            </a>
        </div>

        <div class="customization-wrapper">
            <h1>Personalizza: <span th:text="${file.name}" style="color: var(--text-color);">Nome Modello</span></h1>
            <div class="price-badge">
                Prezzo finale: € <span id="finalPrice" th:text="${file.price}">0.00</span>
            </div>

            <!-- Visualizzatore 3D Interattivo STL -->
            <div th:if="${file.stlPath != null}" style="margin: 20px 0;">
                <h3 style="color: #0F1111; font-size: 16px; margin-bottom: 10px; font-weight: bold;">📦 Anteprima 3D del Modello</h3>
                <div id="stl-container" style="width: 100%; height: 350px; background-color: #1e1e1e; border-radius: 8px; position: relative; overflow: hidden; box-shadow: inset 0 0 10px rgba(0,0,0,0.5);">
                    <div style="position: absolute; top: 10px; left: 10px; color: #fff; font-size: 11px; background: rgba(0,0,0,0.75); padding: 5px 10px; border-radius: 15px; z-index: 10; font-weight: bold; border: 1px solid rgba(255,255,255,0.2);">
                        🖱️ Ruota: Tasto SX | Zoom: Rotellina | Sposta: Tasto DX
                    </div>
                </div>
            </div>

            <!--attenzione perchè quando passiamo questo indirizzo occorre fare attenzione, springboot vede i campi di product ed inizia a riempirli e 
            nel leggere l'url vede che è presente un parametro di nome "id", che è del printFile, ma ha lo stesso nome del parametro del
            real product, quindi lo riempirà. Necessario cambio nome -> fileId -->
            <form th:action="@{/files/{fileId}/personalizza(fileId=${file.id})}" method="POST" th:object="${product}">

                <div style="margin-bottom:20px;">
                    <label>Scegli la grandezza</label>
                    <select th:field="*{size}" id="size" onchange="calcolaPrezzo()">
                        <option value="Piccola">Piccola (Originale)</option>
                        <option value="Media">Media (+5.00€)</option>
                        <option value="Grande">Grande (+10.00€)</option>
                    </select>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" th:field="*{dipinto}" id="dipinto" onchange="calcolaPrezzo()">
                    <label>Vuoi che lo dipingiamo a mano?(+15.00€)</label>
                </div>

                <button type="submit" style="width: 100%;">Conferma Personalizzazione</button>
            </form>
        </div>
    </main>

    <!-- Three.js e STLLoader per la visualizzazione 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>

    <script th:inline="javascript">
        /*<![CDATA[*/
        function calcolaPrezzo() {
            let prezzoBase = /*[[${file.price}]]*/ 0.0;
            let finalPrice = prezzoBase;

            let size = document.getElementById("size").value;
            let dipinto = document.getElementById("dipinto").checked;

            //calcoli
            if (size === "Media") {
                finalPrice += 5.0;
            } else if (size === "Grande") {
                finalPrice += 10.0;
            }

            if (dipinto) {
                finalPrice += 15.0;
            }

            document.getElementById("finalPrice").innerText = finalPrice.toFixed(2);
        }

        // Inizializzazione Visualizzatore 3D Three.js
        const stlUrl = /*[[${file.stlPath}]]*/ null;

        if (stlUrl && document.getElementById('stl-container')) {
            const container = document.getElementById('stl-container');

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x22252a);

            const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // Griglia Piatto di Stampa 3D
            const gridHelper = new THREE.GridHelper(100, 20, 0x007185, 0x444444);
            gridHelper.position.y = -0.1;
            scene.add(gridHelper);

            // Luci
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight1.position.set(1, 1.5, 1);
            scene.add(dirLight1);

            const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
            dirLight2.position.set(-1, -0.5, -1);
            scene.add(dirLight2);

            const loader = new THREE.STLLoader();
            loader.load(stlUrl, function (geometry) {
                const material = new THREE.MeshStandardMaterial({ 
                    color: 0xff6b00, 
                    roughness: 0.3,
                    metalness: 0.1
                });

                const mesh = new THREE.Mesh(geometry, material);
                geometry.center();

                geometry.computeBoundingBox();
                const box = geometry.boundingBox;
                const size = new THREE.Vector3();
                box.getSize(size);
                const maxDim = Math.max(size.x, size.y, size.z);

                mesh.position.y = size.y / 2;
                scene.add(mesh);

                camera.position.set(maxDim * 1.5, maxDim * 1.2, maxDim * 2);
                camera.lookAt(0, size.y / 2, 0);
                controls.target.set(0, size.y / 2, 0);
                controls.update();
            }, undefined, function (error) {
                console.error('Errore nel caricamento del file STL:', error);
            });

            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                if (!container) return;
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            });
        }
        /*]]>*/
    </script>
</body>

</html>
