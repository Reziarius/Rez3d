<!DOCTYPE html>
<html>

<head>
    <title>Personalizza modello</title>
    <link rel="stylesheet" href="/css/stileAma.css">
</head>

<body>
    <main>
        <div class="customization-wrapper">


            <h1>Personalizza: <span th:text="${file.name}" style="color: var(--text-color);">Nome Modello</span></h1>

            <!-- 1. Il contenitore dove apparirà il modello 3D -->
            <div id="stl_cont"
                style="width: 100%; max-width: 500px; height: 400px; margin: 0 auto; border: 1px solid #ddd; border-radius: 8px; overflow: hidden;">
            </div>

            <!-- 2. Importiamo lo script direttamente online (senza scaricare nulla) -->
            <script src="https://viewstl.com/plugin/stl_viewer.min.js"></script>

            <!-- 3. Inizializziamo il visualizzatore passandogli il nome del file dal Database -->
            <script th:inline="javascript">
                // th:inline ci permette di leggere variabili Java/Thymeleaf dentro JavaScript!
                // Sostituisci file.stlFileName con il getter corretto della tua entità
                var nomeFile = /*[[${file.stlFileName}]]*/ 'test.stl';
                var percorsoCompleto = '/models/' + nomeFile;

                var stl_viewer = new StlViewer(
                    document.getElementById("stl_cont"),
                    {
                        models: [{ id: 0, filename: percorsoCompleto }],
                        bgcolor: "#f4f4f4",       // Sfondo grigio chiaro elegante
                        model_color: "#007bff",   // Colore del modello 3D (es. blu)
                        zoom: -1                  // Auto-zoom per inquadrare tutto il modello
                    }
                );
            </script>

            <div class="price-badge">
                Prezzo finale: € <span id="finalPrice" th:text="${file.price}">0.00</span></p>
            </div>
            <!--attenzione perchè quando passiamo questo indirizzo occorre fare attenzione, springboot vede i campi di product ed inizia a riempirli e 
            nel leggere l'url vede che è presente un parametro di nome "id", che è del printFile, ma ha lo stesso nome del parametro del
            real product, quindi lo riempirà. Necessario cambio nome -> fileId -->
            <form th:action="@{/files/{fileId}/personalizza(fileId=${file.id})}" method="POST" th:object="${product}">

                <div style="margin-bottom:20px;">
                    <label>Scegli la grandezza</label>
                    <select th:field="*{size}" id="size" onchange="calcolaPrezzo()">
                        <option value="Piccola">Piccola (Originale)</option>
                        <option value="Media">Media (+5.00€)</option>
                        <option value="Grande">Grande (+10.00€)</option>
                    </select>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" th:field="*{dipinto}" id="dipinto" onchange="calcolaPrezzo()">
                    <label>Vuoi che lo dipingiamo a mano?(+15.00€)</label>
                </div>

                <button type="submit" style="width: 100%;">Conferma Personalizzazione</button>
            </form>
        </div>
    </main>

    <script th:inline="javascript">
        function calcolaPrezzo() {
            let prezzoBase = /*[[${file.price}]]*/ 0.0;
            let finalPrice = prezzoBase;

            let size = document.getElementById("size").value;
            let dipinto = document.getElementById("dipinto").checked;

            //calcoli
            if (size === "Media") {
                finalPrice += 5.0;
            } else if (size === "Grande") {
                finalPrice += 10.0;
            }

            if (dipinto) {
                finalPrice += 15.0;
            }

            document.getElementById("finalPrice").innerText = finalPrice.toFixed(2);
        }
    </script>
</body>

</html>
